<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">A.C.C.E.S.S. — the public notebook</title>
  <desc id="desc">Dark ink, dusty rose, a line drawing of a ribbon and a delicate flower frame a notebook on persistent systems and explicit boundaries.</desc>
  <defs>
    <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#17131b"/><stop offset="1" stop-color="#0d0e12"/></linearGradient>
    <radialGradient id="rose"><stop stop-color="#c98ba0" stop-opacity=".12"/><stop offset="1" stop-color="#c98ba0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#d0b3c0" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1100" height="470" rx="20" fill="url(#ink)"/>
  <rect width="1100" height="470" rx="20" fill="url(#grid)"/>
  <ellipse cx="875" cy="218" rx="265" ry="230" fill="url(#rose)"/>
  <rect x="20" y="20" width="1060" height="430" rx="11" fill="none" stroke="#c98ba0" stroke-opacity=".22"/>
  <g fill="#b4acbc" font-family="Arial, sans-serif">
    <text x="62" y="68" font-size="15" letter-spacing="3">LOLO · TECHNICAL NOTES</text>
    <text x="62" y="185" fill="#f2e8ed" font-family="Georgia, serif" font-size="78">A.C.C.E.S.S.</text>
    <text x="64" y="232" fill="#d7a5b8" font-family="Georgia, serif" font-size="28" font-style="italic">persistent systems, explicit boundaries</text>
    <text x="64" y="306" font-size="18">What persists. What crosses a boundary.</text>
    <text x="64" y="334" font-size="18">What reaches its consumer.</text>
    <text x="64" y="417" fill="#c98ba0" font-size="15" letter-spacing="2">MODEL · ARGUMENT · COUNTEREXAMPLE</text>
  </g>
  <path d="M64 365H644" stroke="#c98ba0" stroke-opacity=".3"/>
