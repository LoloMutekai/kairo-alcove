<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">KAIRO — Lolo's selected work</title><desc id="desc">Ink and dusty rose, an architectural object in relief with a small ribbon. Software, persistent AI systems and personal worlds.</desc><defs><linearGradient id="plate" x2="1" y2="1"><stop stop-color="#514350"/><stop offset=".55" stop-color="#211c28"/><stop offset="1" stop-color="#302331"/></linearGradient></defs><rect width="1200" height="430" fill="#101014"/><g fill="none" stroke="#38343f"><path d="M45 65H1155M45 390H1155"/><circle cx="945" cy="230" r="150"/><ellipse cx="945" cy="230" rx="190" ry="57" transform="rotate(-27 945 230)"/></g><g font-family="Arial,sans-serif"><text x="45" y="43" fill="#d3a0b5" font-size="15" letter-spacing="6">KAIRO / SELECTED WORK</text><text x="45" y="174" fill="#eee9e5" font-size="65">A world</text><text x="45" y="249" fill="#eee9e5" font-size="65">of my <tspan fill="#d3a0b5" font-style="italic" font-family="Georgia,serif">own.</tspan></text><text x="48" y="306" fill="#b4adb8" font-size="16">Software. Persistent AI systems. Personal worlds.</text><text x="48" y="352" fill="#d3a0b5" font-size="10" letter-spacing="3">BUILT BY LOLO / WITH A LITTLE PINK</text></g><g transform="translate(835 92) rotate(-8 110 140)"><path d="M-24 0H195L211 288H-8Z" fill="#201e29" stroke="#65576c"/><path d="M-10 5H210L226 293H6Z" fill="#40323f" fill-opacity=".55" stroke="#867181"/><path d="M4 10H224L240 298H20Z" fill="url(#plate)" stroke="#a98a9c"/><text x="43" y="229" fill="#e4d4df" font-size="175" font-family="Georgia,serif">K</text><path d="M128 57C89 19 71 43 90 65C106 80 118 64 128 57ZM136 57C175 19 193 43 174 65C158 80 146 64 136 57ZM128 64L109 104L123 94L130 105L136 64" fill="none" stroke="#d3a0b5"/><path d="M38 252H216" stroke="#a98a9c"/><text x="39" y="279" fill="#d3a0b5" font-family="monospace" font-size="8" letter-spacing="2">PERSONAL BY DESIGN</text></g></svg>