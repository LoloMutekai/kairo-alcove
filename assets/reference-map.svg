<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">An independent public reference model</title>
  <desc id="desc">Two private bits are kept apart. An explicit shared FIFO accepts labelled messages and produces delivery receipts. This is an abstract model, not the private architecture.</desc>
  <rect width="1100" height="300" rx="16" fill="#111016"/>
  <g fill="#19151e" stroke="#c98ba0" stroke-opacity=".4">
    <rect x="40" y="70" width="245" height="135" rx="12"/>
    <rect x="330" y="70" width="245" height="135" rx="12"/>
    <rect x="620" y="70" width="230" height="135" rx="12"/>
    <rect x="900" y="70" width="160" height="135" rx="12"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="550" y="38" fill="#c98ba0" font-size="15" letter-spacing="2">PUBLIC REFERENCE · AN ABSTRACT SPECIFICATION</text>
    <g fill="#f0e5ec" font-family="Georgia, serif" font-size="28"><text x="162" y="115">Private A</text><text x="452" y="115">Private B</text><text x="735" y="115">Shared FIFO</text><text x="980" y="115">Receipts</text></g>
    <g fill="#bab2c2" font-size="18"><text x="162" y="154">bit a</text><text x="452" y="154">bit b</text><text x="735" y="154">labels 0, 1</text><text x="980" y="154">delivered</text></g>
    <g fill="#c98ba0" font-size="14"><text x="162" y="182">own-state update</text><text x="452" y="182">own-state update</text><text x="735" y="182">explicit acceptance</text><text x="980" y="182">observable</text></g>
    <text x="550" y="259" fill="#bab2c2" font-size="18">Observer A sees a, the FIFO and receipts. Its observation excludes b.</text>
  </g>
  <path d="M858 137h31l-6-5m6 5-6 5" stroke="#c98ba0" stroke-width="1.7" fill="none"/>
  <path d="M302 102v70m-8-63 16 56m0-56-16 56" stroke="#c98ba0" stroke-opacity=".5" stroke-width="1.2"/>
</svg>
