name: reference contracts

on:
  push:
    paths: ["reference/**", ".github/workflows/reference.yml"]
  pull_request:
    paths: ["reference/**", ".github/workflows/reference.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check the reference and require counterexample detection
        run: python3 reference/check.py --self-test
